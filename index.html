<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼豆绘图</title>
    <script type="module" crossorigin src="/beidoudou-pindou/assets/index-CgGYmGWO.js"></script>
    <link rel="stylesheet" crossorigin href="/beidoudou-pindou/assets/index-eQ0TgM69.css">
  </head>
  <body>
    <div class="app">
      <aside class="palette-panel">
        <h1>颜料</h1>
        <div id="palette" class="palette-grid"></div>
      </aside>
      <main class="stage">
        <canvas id="board" width="600" height="600"></canvas>
      </main>
      <aside class="tools">
        <label class="upload">
          上传图片
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
        </label>
        <label class="toggle">
          <input id="skip-light" type="checkbox" />
          浅色/透明背景不放豆
        </label>
        <button id="erase" type="button">橡皮</button>
        <button id="undo" type="button">撤销</button>
        <button id="clear" type="button">清空画布</button>
        <button id="export" type="button">导出图纸</button>
        <p id="status" class="status" hidden></p>
        <p id="error" class="error" hidden></p>
        <div id="stats" class="stats"></div>
      </aside>
    </div>
  </body>
</html>
